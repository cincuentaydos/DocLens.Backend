name: CI

on:
  pull_request:
    branches:
      - development
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build DocLens.slnx --configuration Release

      - name: Test
        run: dotnet test DocLens.slnx --configuration Release --no-build

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        # No AWS credentials in CI: -backend=false skips the S3 state backend;
        # validate never evaluates the terraform_remote_state data sources.
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
