name: CD

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - sbx
          - prod
        default: sbx

permissions:
  contents: read
  id-token: write # required for aws-actions/configure-aws-credentials to assume the OIDC role

jobs:
  deploy:
    name: Build, test, and deploy Lambda code
    runs-on: ubuntu-latest
    # push events carry no `inputs` — default to sbx, the only environment
    # with a deploy role provisioned so far (see DocLens.Infra/governance).
    # `environment.url` surfaces the link on this run, the commit status,
    # and the repo's Environments page — same pattern as DocLens.Web.Template's
    # cd.yml. Points at Swagger, not the bare API root, since that's what's
    # actually browsable without a Bearer token.
    environment:
      name: ${{ github.event.inputs.environment || 'sbx' }}
      url: ${{ vars.SWAGGER_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test DocLens.slnx --configuration Release

      - name: Publish
        # Self-contained: provided.al2023 has no .NET preinstalled (that's
        # why this uses the custom runtime instead of a managed dotnetN
        # one — no dotnet10 runtime exists yet), so the runtime has to
        # ship inside the package. This makes the ZIP ~90MB+.
        #
        # No shared restore step + --no-restore here on purpose: a plain
        # `dotnet restore` only resolves the runner's own RID, so a later
        # `--no-restore` publish for linux-x64 fails with NETSDK1047
        # ("doesn't have a target for net10.0/linux-x64"). Letting publish
        # do its own restore (implicit, no flag) resolves the linux-x64
        # runtime pack it actually needs.
        run: dotnet publish src/DocLens.Lambda -c Release -r linux-x64 --self-contained true -o publish

      - name: Package zip
        # This module deploys all five functions from one ZIP — same
        # convention as infra/terraform/modules/processing/variables.tf's
        # lambda_zip_path (each function just points at a different
        # handler inside the same published assembly).
        #
        # `dotnet publish -r linux-x64` names the apphost after the
        # assembly (DocLens.Lambda), but the provided.al2023 runtime
        # invokes a file literally named `bootstrap` — rename it and mark
        # it executable *before* zipping (zip only preserves permissions
        # set at zip time, not after).
        run: |
          cd publish
          mv DocLens.Lambda bootstrap
          chmod +x bootstrap
          zip -r ../doclens-lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Run database migrations
        # Runs before the code deploy below so any schema a new release
        # depends on is already in place by the time it goes live — see
        # migrations/README.md.
        run: ./migrations/run-migrations.sh
        env:
          AURORA_CLUSTER_ARN: ${{ vars.AURORA_CLUSTER_ARN }}
          AURORA_SECRET_ARN: ${{ vars.AURORA_SECRET_ARN }}

      - name: Upload package to S3
        # A self-contained package is well past the 50MB direct-upload
        # limit for update-function-code's request body — stage it in S3
        # (the same artifacts bucket infra/terraform/modules/processing/artifacts.tf
        # creates) and point Lambda at that instead.
        id: upload
        run: |
          KEY="ci/doclens-lambda-${{ github.sha }}.zip"
          aws s3 cp doclens-lambda.zip "s3://${{ vars.LAMBDA_ARTIFACTS_BUCKET }}/$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Deploy API Lambda
        run: aws lambda update-function-code --function-name "${{ vars.LAMBDA_API_ARN }}" --s3-bucket "${{ vars.LAMBDA_ARTIFACTS_BUCKET }}" --s3-key "${{ steps.upload.outputs.key }}"

      - name: Deploy Extraction Worker Lambda
        run: aws lambda update-function-code --function-name "${{ vars.LAMBDA_EXTRACTION_WORKER_ARN }}" --s3-bucket "${{ vars.LAMBDA_ARTIFACTS_BUCKET }}" --s3-key "${{ steps.upload.outputs.key }}"

      - name: Deploy Textract Bridge Lambda
        run: aws lambda update-function-code --function-name "${{ vars.LAMBDA_TEXTRACT_BRIDGE_ARN }}" --s3-bucket "${{ vars.LAMBDA_ARTIFACTS_BUCKET }}" --s3-key "${{ steps.upload.outputs.key }}"

      - name: Deploy Review Worker Lambda
        run: aws lambda update-function-code --function-name "${{ vars.LAMBDA_REVIEW_WORKER_ARN }}" --s3-bucket "${{ vars.LAMBDA_ARTIFACTS_BUCKET }}" --s3-key "${{ steps.upload.outputs.key }}"

      - name: Deploy Sync Worker Lambda
        run: aws lambda update-function-code --function-name "${{ vars.LAMBDA_SYNC_WORKER_ARN }}" --s3-bucket "${{ vars.LAMBDA_ARTIFACTS_BUCKET }}" --s3-key "${{ steps.upload.outputs.key }}"

      - name: Print API endpoint
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ vars.API_ENDPOINT }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Swagger: ${{ vars.SWAGGER_URL }}" >> "$GITHUB_STEP_SUMMARY"
